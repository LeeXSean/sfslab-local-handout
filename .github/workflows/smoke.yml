name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -C sfslab all

      - name: Run autograder on starter (expected incomplete, exit 1)
        run: |
          cd sfslab
          ./test-sfs -q && exit 1 || test $? -eq 1

      - name: Rebuild handout tarball and compare to committed copy
        run: |
          make dist
          git diff --exit-code -- sfslab-handout.tar

      - name: Build writeup PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends groff-base ghostscript
          make pdf
